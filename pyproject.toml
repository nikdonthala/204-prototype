[project]
name = "expiry-redistribution-agent"
version = "0.1.0"
description = "AI-powered Expiry Risk & Redistribution Agent - predicts inventory expiry risk and recommends optimal stock transfers"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
expiry-agent = "expiry_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["expiry_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
